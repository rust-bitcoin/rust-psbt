---
name: Weekly cargo-mutants

on:   # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 0 * * 0"  # Sunday 00:00 UTC.
  workflow_dispatch:     # Allow manual triggering.

jobs:
  cargo-mutants:
    runs-on: debian-trixie
    steps:
      - uses: https://data.forgejo.org/actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6
        with:
          persist-credentials: false
      - uses: ./.forgejo/actions/setup-rbmt
      - name: Run cargo mutants
        id: mutants
        run: |
          set +e
          cargo +$(cargo rbmt toolchains --nightly) mutants --in-place -- -- -Z unstable-options --fail-fast
          echo "exit_code=$?" >> "$FORGEJO_OUTPUT"
      - name: Open issue when new mutants are found
        if: steps.mutants.outputs.exit_code == '2'
        run: |
          jq -n \
            --arg title "Mutants Found" \
            --arg body "See the full list in the run log: ${FORGEJO_SERVER_URL}/${FORGEJO_REPOSITORY}/actions/runs/${FORGEJO_RUN_NUMBER}" \
            '{title: $title, body: $body}' | \
          curl -sSf \
            -X POST \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "User-Agent: curl/8.5.0" \
            -H "Content-Type: application/json" \
            --data-binary @- \
            "${FORGEJO_SERVER_URL}/api/v1/repos/${FORGEJO_REPOSITORY}/issues"
      - name: Fail on unexpected mutants outcome
        if: steps.mutants.outputs.exit_code != '0' && steps.mutants.outputs.exit_code != '2'
        run: exit 1
