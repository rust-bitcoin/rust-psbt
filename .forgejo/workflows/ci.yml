---
# rust-psbt continuous integration. All checks must pass to merge a patch.
#
# Job is optimized for developer debugging, not runner minutes.
name: Continuous Integration

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  Test:
    runs-on: debian-trixie
    strategy:
      fail-fast: false
      matrix:
        include:
          - { toolchain: msrv,   lockfile: minimal }
          - { toolchain: stable, lockfile: maximum }
    steps:
      - uses: https://data.forgejo.org/actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6
        with:
          fetch-depth: 0 # Context required for bisectability tests.
          persist-credentials: false
      - uses: https://git.rust-bitcoin.org/rust-bitcoin/rust-bitcoin-maintainer-tools/actions/setup-rbmt@0ce7152ca25bb7d7892b7d0128cc6b1be4630038
      - name: "Run tests"
        run: cargo rbmt test --lockfile ${{ matrix.lockfile }} --toolchain ${{ matrix.toolchain }} --baseline ${{ forgejo.event.pull_request.base.sha || forgejo.event.before }}

  Check:
    runs-on: debian-trixie
    strategy:
      fail-fast: false
      matrix:
        command: [lint, docs]
    steps:
      - uses: https://data.forgejo.org/actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6
      - uses: https://git.rust-bitcoin.org/rust-bitcoin/rust-bitcoin-maintainer-tools/actions/setup-rbmt@0ce7152ca25bb7d7892b7d0128cc6b1be4630038
      - name: "Run check"
        run: cargo rbmt ${{ matrix.command }} --lockfile maximum

  Integration:
    runs-on: debian-trixie
    steps:
      - uses: https://data.forgejo.org/actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6
      - uses: https://git.rust-bitcoin.org/rust-bitcoin/rust-bitcoin-maintainer-tools/actions/setup-rbmt@0ce7152ca25bb7d7892b7d0128cc6b1be4630038
      - name: "Run bitcoind integration tests"
        run: cargo rbmt integration

  Format:
    runs-on: debian-trixie
    steps:
      - uses: https://data.forgejo.org/actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6
      - uses: https://git.rust-bitcoin.org/rust-bitcoin/rust-bitcoin-maintainer-tools/actions/setup-rbmt@0ce7152ca25bb7d7892b7d0128cc6b1be4630038
      - name: "Check format"
        run: cargo rbmt fmt --check

  Fuzz:
    runs-on: debian-trixie
    steps:
      - uses: https://data.forgejo.org/actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6
      - uses: https://git.rust-bitcoin.org/rust-bitcoin/rust-bitcoin-maintainer-tools/actions/setup-rbmt@0ce7152ca25bb7d7892b7d0128cc6b1be4630038
      - name: "Check fuzz targets"
        working-directory: fuzz
        run: |
          cargo rbmt tools
          cargo rbmt with --lockfile minimal --toolchain nightly -- cargo fuzz check

  Mutants:
    runs-on: debian-trixie
    steps:
      - uses: https://data.forgejo.org/actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6
        with:
          fetch-depth: 0 # History required to diff against the baseline.
      - uses: https://git.rust-bitcoin.org/rust-bitcoin/rust-bitcoin-maintainer-tools/actions/setup-rbmt@0ce7152ca25bb7d7892b7d0128cc6b1be4630038
      - name: "Check mutants"
        run: git diff ${{ forgejo.event.pull_request.base.sha || forgejo.event.before }} | cargo ,mutants --in-diff /dev/stdin -- -- -Z unstable-options --fail-fast --nocapture

  Prerelease:
    runs-on: debian-trixie
    steps:
      - uses: https://data.forgejo.org/actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6
        with:
          fetch-depth: 0 # History required to diff against the baseline.
      - uses: https://git.rust-bitcoin.org/rust-bitcoin/rust-bitcoin-maintainer-tools/actions/setup-rbmt@0ce7152ca25bb7d7892b7d0128cc6b1be4630038
      - name: "Run prerelease checks"
        run: cargo rbmt prerelease --baseline ${{ forgejo.event.pull_request.base.sha || forgejo.event.before }}
