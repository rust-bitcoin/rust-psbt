[package]
name = "psbt-v2"
version = "0.3.0"
authors = ["Tobin C. Harding <me@tobin.cc>"]
license = "CC0-1.0"
repository = "https://git.rust-bitcoin.org/rust-bitcoin/rust-psbt"
description = "Partially Signed Bitcoin Transaction, v0 and v2"
categories = ["cryptography::cryptocurrencies"]
keywords = [ "psbt", "bip-174", "bip174", "bip-370", "bip370"]
readme = "README.md"
edition = "2021"
rust-version = "1.74.0"
exclude = ["api", "tests", "contrib"]

[package.metadata]
rbmt.version = "0.5.4"
rbmt.toolchains = { nightly = "nightly-2026-11-07", stable = "1.99.1" }
rbmt.tools = { cargo-mutants = "27.1.0" }
rbmt.lock.lockfiles = [ "minimal", "maximum" ]

[package.metadata.rbmt.test]
examples = [
    "v0:std",
    "v2:std",
    "v2-separate-creator-constructor:std",
]

[package.metadata.rbmt.lint]
allowed_duplicates = [
  "hex-conservative",  # Required until we drop the 0.32 series of bitcoin.
  "syn",               # serde_derive and the old secp256k1 deps clash, scep256k1 will be upgraded at some point.
  "secp256k1",         # bitcoin 0.32 pulls in v0.29; musig feature pulls in v0.33.
  "secp256k1-sys",     # Two secp versions, two sys crates.
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std"]
std = ["bitcoin/std", "bitcoin-consensus-encoding/std", "miniscript?/std", "secp256k1-33?/std"]
rand = ["std", "bitcoin/rand-std"]
serde = ["dep:serde", "bitcoin/serde", "bitcoin-consensus-encoding/serde"]
base64 = ["bitcoin/base64"]
silent-payments = []
musig = ["dep:secp256k1-33"]

[dependencies]
bitcoin = { version = "0.32.102", default-features = false, features = ["encoding"] }
bitcoin-consensus-encoding = { version = "1.3.0", default-features = false, features = ["alloc", "hex"] }

arbitrary = { version = "1.0.1", optional = true }
miniscript = { version = "13.2.0", default-features = false, optional = true }
serde = { version = "1.0.195", default-features = false, features = ["derive", "alloc"], optional = true }
secp256k1-33 = { package = "secp256k1", version = "0.33", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1.0.68"

[[example]]
name = "v0"
required-features = ["std"]

[[example]]
name = "v2"
required-features = ["std"]

[[example]]
name = "v2-separate-creator-constructor"
required-features = ["std"]

[[example]]
name = "psbt2json"
required-features = ["serde"]

[[example]]
name = "grinding_bench"
required-features = ["std"]

[lints.rust]
missing_docs = "warn"

[lints.clippy]
redundant_clone = "warn"
use_self = "warn"
