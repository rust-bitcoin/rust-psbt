[package]
name = "bitcoind-tests"
version = "0.1.0"
authors = ["Tobin C. Harding <me@tobin.cc>"]
license = "CC0-1.0"
edition = "2021"
publish = false

[package.metadata.rbmt.toolchains]
stable = "1.98.1"

[dependencies]
bitcoind = { version = "0.41.0", features = ["download"] }
psbt-v2 = { path = "..", features = ["std", "miniscript", "rand", "base64"] }

[features]
"latest" = ["bitcoind/31_0"]  # Most recent Bitcoin Core version.
"v0" = ["bitcoind/0_17_2"]    # Initial PSBT v0 (BIP-174) support.
